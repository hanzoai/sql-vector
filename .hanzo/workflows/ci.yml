# Build the extension and run its regression suite against one PostgreSQL.
#
# Upstream's matrix covered PostgreSQL 13-19 across ubuntu-22.04/24.04 (x86 and
# arm), macOS and Windows. None of those labels exist on this fleet, and an
# unserved label queues instead of failing — so that matrix has not been running,
# it has been sitting in a queue looking like nothing was wrong. What is kept is
# one column of it, on a runner that answers: the version drift that a matrix
# catches is now uncovered, and that is a real loss, but a single gate that runs
# beats seven that do not.
name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: hanzo-build-linux-amd64
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL server headers
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            postgresql-16 postgresql-server-dev-16 build-essential

      - name: Build
        run: make PG_CONFIG=/usr/lib/postgresql/16/bin/pg_config

      - name: Install
        run: sudo make install PG_CONFIG=/usr/lib/postgresql/16/bin/pg_config

      # installcheck connects as the invoking user. That is root here, and a
      # fresh cluster has no root role, so the suite bailed on the first psql
      # with `role "root" does not exist` -- after the extension had already
      # built and installed cleanly. Give root a superuser role instead of
      # running the suite as postgres, so the test database is created and
      # dropped by the same user that owns the build tree.
      - name: Regression tests
        run: |
          set -eux
          sudo pg_ctlcluster 16 main start
          sudo -u postgres createuser -s root
          make installcheck PG_CONFIG=/usr/lib/postgresql/16/bin/pg_config

      - name: Show diffs on failure
        if: failure()
        run: cat regression.diffs || true
